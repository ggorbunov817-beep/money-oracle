<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Money Oracle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0A0A0A;
            --card: rgba(26, 26, 26, 0.8);
            --card-border: rgba(255, 255, 255, 0.06);
            --income: #00FF88;
            --expense: #FF4757;
            --accent: #7C5CFC;
            --accent-glow: rgba(124, 92, 252, 0.4);
            --text: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.35);
            --radius: 16px;
            --radius-sm: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            padding-bottom: 100px;
        }
        .header {
            padding: 14px 16px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10,10,10,0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
        }
        .header-logo { display: flex; align-items: center; gap: 8px; }
        .header-icon {
            width: 34px; height: 34px;
            background: linear-gradient(135deg, var(--accent), #9B7CFC);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .header-title { font-size: 16px; font-weight: 700; }
        .header-subtitle { font-size: 10px; color: var(--text-muted); }
        .premium-badge {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            font-size: 11px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 16px;
            cursor: pointer;
        }
        .main-scroll { padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; }
        .glass-card {
            background: var(--card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 16px;
        }
        .balance-card { text-align: center; padding: 20px 16px; }
        .balance-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 4px; }
        .balance-amount {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #FFF, rgba(255,255,255,0.8));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .balance-currency { font-size: 16px; -webkit-text-fill-color: var(--text-secondary); }
        .balance-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            font-size: 12px;
        }
        .balance-row .inc { color: var(--income); }
        .balance-row .exp { color: var(--expense); }
        .period-tabs {
            display: flex;
            background: rgba(255,255,255,0.04);
            border-radius: 20px;
            padding: 3px;
            margin: 10px 0;
        }
        .period-tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            border-radius: 18px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
            border: none;
            background: transparent;
        }
        .period-tab.active {
            background: var(--accent);
            color: #fff;
        }
        .chart-container { height: 220px; margin-top: 6px; }
        .chart-container canvas { width: 100% !important; height: 100% !important; }
        .section-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .categories-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .category-chip {
            padding: 12px 6px;
            background: rgba(255,255,255,0.03);
            border-radius: var(--radius-sm);
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            font-size: 11px;
        }
        .category-chip.selected { border-color: var(--accent); background: rgba(124,92,252,0.15); }
        .category-chip .cat-icon { font-size: 22px; display: block; margin-bottom: 3px; }
        .category-chip .cat-name { color: var(--text-secondary); }
        .category-chip .cat-amount { font-weight: 700; margin-top: 2px; }
        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            background: rgba(255,255,255,0.02);
        }
        .history-left { display: flex; align-items: center; gap: 10px; }
        .history-icon {
            width: 36px; height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .history-date { font-size: 10px; color: var(--text-muted); }
        .history-amount { font-weight: 700; font-size: 15px; }
        .history-amount.inc { color: var(--income); }
        .history-amount.exp { color: var(--expense); }
        .advisor-card {
            background: linear-gradient(135deg, rgba(124,92,252,0.15), rgba(0,255,136,0.08));
            border: 1px solid rgba(124,92,252,0.3);
        }
        .advisor-text { font-size: 13px; line-height: 1.5; color: var(--text-secondary); }
        .fab {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 52px; height: 52px;
            background: var(--accent);
            border-radius: 50%;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 6px 24px var(--accent-glow);
            z-index: 200;
            border: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            z-index: 300;
            display: flex;
            align-items: flex-end;
        }
        .modal-overlay.hidden { display: none; }
        .modal-sheet {
            width: 100%;
            background: #1A1A1A;
            border-radius: 20px 20px 0 0;
            padding: 16px 16px 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .modal-handle {
            width: 30px; height: 3px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin: 0 auto 14px;
        }
        .modal-title { font-size: 16px; font-weight: 700; text-align: center; margin-bottom: 12px; }
        .modal-input {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            outline: none;
        }
        .modal-input:focus { border-color: var(--accent); }
        .type-toggle {
            display: flex;
            background: rgba(255,255,255,0.04);
            border-radius: 20px;
            padding: 2px;
            margin-bottom: 10px;
        }
        .type-btn {
            flex: 1;
            padding: 8px;
            border-radius: 18px;
            text-align: center;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-muted);
        }
        .type-btn.active.inc { background: rgba(0,255,136,0.2); color: var(--income); }
        .type-btn.active.exp { background: rgba(255,71,87,0.2); color: var(--expense); }
        .modal-categories {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 10px;
        }
        .modal-cat {
            padding: 10px 4px;
            background: rgba(255,255,255,0.03);
            border-radius: var(--radius-sm);
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            font-size: 11px;
        }
        .modal-cat.selected { background: rgba(124,92,252,0.2); border-color: var(--accent); }
        .modal-cat .cat-icon { font-size: 20px; display: block; margin-bottom: 2px; }
        .modal-actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
            text-align: center;
        }
        .btn-cancel { background: rgba(255,255,255,0.05); color: var(--text-secondary); }
        .btn-add {
            background: var(--accent);
            color: #fff;
        }
        .btn-add.expense { background: var(--expense); }
        .toast {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            z-index: 400;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 1.5s forwards;
            pointer-events: none;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }
        .toast.success { background: rgba(0,255,136,0.2); color: var(--income); }
        .toast.error { background: rgba(255,71,87,0.2); color: var(--expense); }
        .empty-state { text-align: center; padding: 30px; color: var(--text-muted); }
        .empty-icon { font-size: 40px; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-logo">
        <div class="header-icon">🔮</div>
        <div>
            <div class="header-title">Money Oracle</div>
            <div class="header-subtitle">Предиктивный счётчик</div>
        </div>
    </div>
    <div class="premium-badge" id="premiumBadge" onclick="togglePremium()">⭐ PRO</div>
</div>

<div class="main-scroll" id="mainScroll">

    <!-- Balance -->
    <div class="glass-card balance-card">
        <div class="balance-label" id="balanceLabel">Баланс за всё время</div>
        <div class="balance-amount" id="balanceDisplay">0 <span class="balance-currency">₽</span></div>
        <div class="balance-row">
            <span class="inc">📥 <span id="totalIncome">0</span> ₽</span>
            <span class="exp">📤 <span id="totalExpense">0</span> ₽</span>
        </div>
        <div class="period-tabs" id="periodTabs">
            <button class="period-tab active" data-period="all">Всё</button>
            <button class="period-tab" data-period="year">Год</button>
            <button class="period-tab" data-period="month">Месяц</button>
            <button class="period-tab" data-period="week">Неделя</button>
            <button class="period-tab" data-period="day">День</button>
        </div>
    </div>

    <!-- Chart -->
    <div class="glass-card" id="chartCard">
        <div class="section-title"><span>📊</span> Динамика</div>
        <div class="chart-container"><canvas id="budgetChart"></canvas></div>
        <div class="empty-state" id="chartEmpty" style="display:none;">
            <div class="empty-icon">📈</div>
            <div>Добавь операции для графика</div>
        </div>
    </div>

    <!-- Categories -->
    <div class="glass-card" id="categoriesCard">
        <div class="section-title"><span>📂</span> Категории</div>
        <div class="categories-grid" id="categoriesGrid"></div>
        <div class="empty-state" id="catEmpty" style="display:none;">
            <div class="empty-icon">🏷️</div>
            <div>Нет данных по категориям</div>
        </div>
    </div>

    <!-- AI Advisor (Premium) -->
    <div class="glass-card advisor-card" id="advisorCard" style="display:none;">
        <div class="section-title"><span>🤖</span> AI-советник</div>
        <div class="advisor-text" id="advisorText"></div>
    </div>

    <!-- History -->
    <div class="glass-card" id="historyCard">
        <div class="section-title"><span>📋</span> История операций</div>
        <div id="historyList"></div>
        <div class="empty-state" id="historyEmpty" style="display:none;">
            <div class="empty-icon">📭</div>
            <div>Операций пока нет</div>
        </div>
    </div>

    <!-- Reset button (temporary) -->
    <div style="text-align:center;padding:8px;">
        <button onclick="resetAll()" style="background:rgba(255,71,87,0.15);color:var(--expense);border:1px solid rgba(255,71,87,0.3);padding:6px 16px;border-radius:14px;font-size:11px;cursor:pointer;">🔄 Сбросить данные</button>
    </div>
</div>

<button class="fab" onclick="openAddModal()">+</button>

<!-- Modal -->
<div class="modal-overlay hidden" id="addModal">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Добавить операцию</div>
        <div class="type-toggle">
            <button class="type-btn active exp" id="typeExpense" onclick="setType('expense')">📤 Расход</button>
            <button class="type-btn inc" id="typeIncome" onclick="setType('income')">📥 Доход</button>
        </div>
        <input type="number" class="modal-input" id="amountInput" placeholder="0" inputmode="decimal" autofocus>
        <div class="modal-categories" id="modalCategories"></div>
        <div class="modal-actions">
            <button class="btn btn-cancel" onclick="closeAddModal()">Отмена</button>
            <button class="btn btn-add expense" id="addButton" onclick="addOperation()">Добавить</button>
        </div>
    </div>
</div>

<div id="toastContainer"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#0A0A0A');
    tg.setBackgroundColor('#0A0A0A');
}

const STORAGE_KEY = 'money_oracle_v2';
const PREMIUM_PRICE = 50;

const allCategories = {
    income: [
        { id: 'inc_salary', icon: '💼', name: 'Зарплата' },
        { id: 'inc_freelance', icon: '💎', name: 'Подработка' },
        { id: 'inc_gift', icon: '🎁', name: 'Подарки' },
        { id: 'inc_invest', icon: '📈', name: 'Инвестиции' },
        { id: 'inc_refund', icon: '↩️', name: 'Возврат' },
        { id: 'inc_other', icon: '📥', name: 'Прочее' },
    ],
    expense: [
        { id: 'exp_food', icon: '🍕', name: 'Еда' },
        { id: 'exp_transport', icon: '🚗', name: 'Транспорт' },
        { id: 'exp_rent', icon: '🏠', name: 'Аренда' },
        { id: 'exp_subs', icon: '📱', name: 'Подписки' },
        { id: 'exp_fun', icon: '🎮', name: 'Развлечения' },
        { id: 'exp_health', icon: '💊', name: 'Здоровье' },
        { id: 'exp_clothes', icon: '👕', name: 'Одежда' },
        { id: 'exp_beauty', icon: '💄', name: 'Красота' },
        { id: 'exp_other', icon: '📤', name: 'Прочее' },
    ]
};

let appData = loadData();
let currentType = 'expense';
let selectedCategory = null;
let currentPeriod = 'all';
let budgetChart = null;

function loadData() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
    } catch(e) {}
    return {
        balance: 0,
        operations: [],
        isPremium: false,
        startDate: new Date().toISOString().split('T')[0]
    };
}

function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
}

function getCategoryById(id) {
    const all = [...allCategories.income, ...allCategories.expense];
    return all.find(c => c.id === id) || { icon: '❓', name: 'Неизвестно' };
}

function filterOpsByPeriod(ops, period) {
    const now = new Date();
    const start = new Date();
    switch(period) {
        case 'day': start.setHours(0,0,0,0); break;
        case 'week': start.setDate(now.getDate() - now.getDay()); start.setHours(0,0,0,0); break;
        case 'month': start.setDate(1); start.setHours(0,0,0,0); break;
        case 'year': start.setMonth(0); start.setDate(1); start.setHours(0,0,0,0); break;
        default: return ops;
    }
    return ops.filter(op => new Date(op.date) >= start);
}

function calculateStats() {
    const ops = filterOpsByPeriod(appData.operations, currentPeriod);
    let income = 0, expense = 0;
    const catIncome = {}, catExpense = {};
    const dailyData = {};

    ops.forEach(op => {
        if (op.type === 'income') {
            income += op.amount;
            catIncome[op.category] = (catIncome[op.category] || 0) + op.amount;
        } else {
            expense += op.amount;
            catExpense[op.category] = (catExpense[op.category] || 0) + op.amount;
        }
        const day = op.date;
        if (!dailyData[day]) dailyData[day] = { income: 0, expense: 0 };
        if (op.type === 'income') dailyData[day].income += op.amount;
        else dailyData[day].expense += op.amount;
    });

    return { income, expense, balance: income - expense, catIncome, catExpense, dailyData, totalOps: ops.length };
}

function generateAdvice(stats) {
    if (stats.totalOps === 0) return 'Добавь первые операции, и я дам совет по тратам.';
    const total = stats.income || 1;
    const foodPct = ((stats.catExpense['exp_food'] || 0) / total) * 100;
    const funPct = ((stats.catExpense['exp_fun'] || 0) / total) * 100;
    const advice = [];
    if (foodPct > 30) advice.push('🍕 Ты тратишь больше 30% на еду — попробуй готовить дома.');
    if (funPct > 20) advice.push('🎮 Развлечения занимают большую долю — может, устроить выходные без трат?');
    if (stats.balance < 0) advice.push('⚠️ Расходы превышают доходы — пора пересмотреть бюджет.');
    if (stats.income > 0 && (stats.catIncome['inc_salary'] || 0) / stats.income < 0.7) {
        advice.push('💎 Отличная диверсификация доходов! Подработки помогают.');
    }
    if (advice.length === 0) advice.push('✅ Твои финансы в порядке! Продолжай в том же духе.');
    return advice.join('\n\n');
}

// Render
function renderAll() {
    const stats = calculateStats();
    document.getElementById('totalIncome').textContent = stats.income.toLocaleString('ru-RU');
    document.getElementById('totalExpense').textContent = stats.expense.toLocaleString('ru-RU');
    document.getElementById('balanceDisplay').innerHTML = `${stats.balance.toLocaleString('ru-RU')} <span class="balance-currency">₽</span>`;

    const labels = { all: 'Баланс за всё время', year: 'Баланс за год', month: 'Баланс за месяц', week: 'Баланс за неделю', day: 'Баланс за день' };
    document.getElementById('balanceLabel').textContent = labels[currentPeriod] || 'Баланс';

    renderChart(stats);
    renderCategories(stats);
    renderHistory(stats);
    renderAdvisor(stats);
    updatePremiumUI();
}

function renderChart(stats) {
    const container = document.getElementById('chartContainer');
    const empty = document.getElementById('chartEmpty');
    if (stats.totalOps === 0) {
        container.style.display = 'none';
        empty.style.display = 'block';
        if (budgetChart) { budgetChart.destroy(); budgetChart = null; }
        return;
    }
    container.style.display = 'block';
    empty.style.display = 'none';

    const ctx = document.getElementById('budgetChart').getContext('2d');
    if (budgetChart) budgetChart.destroy();

    const days = Object.keys(stats.dailyData).sort();
    const labels = days.map(d => d.slice(5));
    const incData = days.map(d => stats.dailyData[d].income);
    const expData = days.map(d => stats.dailyData[d].expense);

    budgetChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels,
            datasets: [
                { label: 'Доходы', data: incData, backgroundColor: 'rgba(0,255,136,0.5)', borderRadius: 6 },
                { label: 'Расходы', data: expData, backgroundColor: 'rgba(255,71,87,0.5)', borderRadius: 6 },
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { labels: { color: 'rgba(255,255,255,0.5)', boxWidth: 10, padding: 12, font: { size: 10 } } }
            },
            scales: {
                x: { ticks: { color: 'rgba(255,255,255,0.3)', font: { size: 9 } }, grid: { display: false } },
                y: { ticks: { color: 'rgba(255,255,255,0.3)', callback: v => v>=1000 ? Math.round(v/1000)+'k' : v, font: { size: 9 } }, grid: { color: 'rgba(255,255,255,0.04)' } }
            }
        }
    });
}

function renderCategories(stats) {
    const grid = document.getElementById('categoriesGrid');
    const empty = document.getElementById('catEmpty');

    const allCats = [
        ...Object.entries(stats.catIncome).map(([id, amt]) => ({ id, amt, type: 'income' })),
        ...Object.entries(stats.catExpense).map(([id, amt]) => ({ id, amt, type: 'expense' })),
    ].sort((a,b) => b.amt - a.amt);

    if (allCats.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';
    grid.innerHTML = allCats.slice(0, 6).map(c => {
        const cat = getCategoryById(c.id);
        return `<div class="category-chip">
            <span class="cat-icon">${cat.icon}</span>
            <span class="cat-name">${cat.name}</span>
            <span class="cat-amount" style="color:${c.type==='income'?'var(--income)':'var(--expense)'}">${c.amt.toLocaleString('ru-RU')} ₽</span>
        </div>`;
    }).join('');
}

function renderHistory(stats) {
    const list = document.getElementById('historyList');
    const empty = document.getElementById('historyEmpty');
    const ops = filterOpsByPeriod(appData.operations, currentPeriod).sort((a,b) => new Date(b.date) - new Date(a.date));

    if (ops.length === 0) {
        list.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';
    list.innerHTML = ops.slice(0, 20).map(op => {
        const cat = getCategoryById(op.category);
        const cls = op.type === 'income' ? 'inc' : 'exp';
        const sign = op.type === 'income' ? '+' : '−';
        return `<div class="history-item">
            <div class="history-left">
                <div class="history-icon" style="background:${op.type==='income'?'rgba(0,255,136,0.1)':'rgba(255,71,87,0.1)'}">${cat.icon}</div>
                <div><div style="font-size:13px;">${cat.name}</div><div class="history-date">${new Date(op.date).toLocaleDateString('ru-RU')}</div></div>
            </div>
            <div class="history-amount ${cls}">${sign}${op.amount.toLocaleString('ru-RU')} ₽</div>
        </div>`;
    }).join('');
}

function renderAdvisor(stats) {
    const card = document.getElementById('advisorCard');
    if (appData.isPremium) {
        card.style.display = 'block';
        document.getElementById('advisorText').textContent = generateAdvice(stats);
    } else {
        card.style.display = 'none';
    }
}

function updatePremiumUI() {
    const badge = document.getElementById('premiumBadge');
    badge.textContent = appData.isPremium ? '⭐ PRO' : '⭐ PRO';
    badge.style.opacity = appData.isPremium ? '1' : '0.7';
}

// Period
document.getElementById('periodTabs').addEventListener('click', function(e) {
    if (e.target.classList.contains('period-tab')) {
        document.querySelectorAll('.period-tab').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentPeriod = e.target.dataset.period;
        renderAll();
    }
});

// Modal
function openAddModal() {
    document.getElementById('addModal').classList.remove('hidden');
    document.getElementById('amountInput').value = '';
    document.getElementById('amountInput').focus();
    selectedCategory = null;
    renderModalCats();
    updateAddBtn();
}

function closeAddModal() {
    document.getElementById('addModal').classList.add('hidden');
}

function setType(type) {
    currentType = type;
    selectedCategory = null;
    const expBtn = document.getElementById('typeExpense');
    const incBtn = document.getElementById('typeIncome');
    const addBtn = document.getElementById('addButton');
    if (type === 'expense') {
        expBtn.classList.add('active', 'exp');
        incBtn.classList.remove('active', 'inc');
        addBtn.classList.add('expense');
    } else {
        incBtn.classList.add('active', 'inc');
        expBtn.classList.remove('active', 'exp');
        addBtn.classList.remove('expense');
    }
    renderModalCats();
    updateAddBtn();
}

function selectCategory(id) {
    selectedCategory = id;
    renderModalCats();
    updateAddBtn();
}

function renderModalCats() {
    const grid = document.getElementById('modalCategories');
    const cats = currentType === 'expense' ? allCategories.expense : allCategories.income;
    grid.innerHTML = cats.map(c => `
        <div class="modal-cat ${selectedCategory===c.id?'selected':''}" onclick="selectCategory('${c.id}')">
            <span class="cat-icon">${c.icon}</span>${c.name}
        </div>
    `).join('');
}

function updateAddBtn() {
    const btn = document.getElementById('addButton');
    btn.textContent = selectedCategory ? 'Добавить ✓' : 'Выбери категорию';
    btn.style.opacity = selectedCategory ? '1' : '0.5';
}

function addOperation() {
    const amount = parseFloat(document.getElementById('amountInput').value);
    if (!amount || amount <= 0) { showToast('Введи сумму', 'error'); return; }
    if (!selectedCategory) { showToast('Выбери категорию', 'error'); return; }

    appData.operations.push({
        id: 'op_' + Date.now(),
        type: currentType,
        amount,
        category: selectedCategory,
        date: new Date().toISOString().split('T')[0],
        note: ''
    });

    if (currentType === 'income') appData.balance += amount;
    else appData.balance -= amount;

    saveData();
    closeAddModal();
    renderAll();
    showToast(`${currentType==='income'?'📥':'📤'} ${amount.toLocaleString('ru-RU')} ₽`, 'success');
}

// Premium
function togglePremium() {
    if (appData.isPremium) {
        showToast('PRO уже активен ⭐', 'success');
        return;
    }
    if (tg) {
        tg.showPopup({
            title: '⭐ Money Oracle PRO',
            message: `AI-советник, прогноз на год, детальная аналитика\n\n${PREMIUM_PRICE} Stars`,
            buttons: [{ id: 'buy', type: 'default', text: `Купить за ${PREMIUM_PRICE} ⭐` }, { type: 'cancel' }]
        }, (btn) => {
            if (btn === 'buy') {
                // Simulate payment (replace with real invoice)
                appData.isPremium = true;
                saveData();
                renderAll();
                showToast('PRO активирован! 🎉', 'success');
            }
        });
    } else {
        appData.isPremium = true;
        saveData();
        renderAll();
        showToast('PRO активирован (тест) 🎉', 'success');
    }
}

// Reset
function resetAll() {
    appData = {
        balance: 0,
        operations: [],
        isPremium: appData.isPremium,
        startDate: new Date().toISOString().split('T')[0]
    };
    saveData();
    renderAll();
    showToast('Данные сброшены', 'success');
}

// Toast
function showToast(msg, type) {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 2000);
}

// Init
document.getElementById('addModal').addEventListener('click', function(e) {
    if (e.target === this) closeAddModal();
});

renderAll();
</script>
</body>
</html>
